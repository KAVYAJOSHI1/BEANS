# BEANS CI: every push and pull request is checked the same way, so a broken change never reaches penultimate / main
# unnoticed. Run the same checks locally with `make ci`.
#   tests   the full pytest suite on the exact dependency versions in constraints.txt; tests must not modify the repo
#   ui      lint (errors only) + rebuild; the committed ui/dist must match the source, because FastAPI serves it as is
#   docker  the offline image builds and serves the dashboard and API with networking disabled (shared branches, PRs)
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: System libraries (as in the Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libharfbuzz-subset0 fonts-dejavu-core libgomp1 openssl fonts-lohit-deva
      - name: Install (pinned)
        run: pip install -r requirements.txt -c constraints.txt
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Tests left the repository unchanged
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::running the tests changed or created files in the repository:"; git status --porcelain; exit 1
          fi

  ui:
    name: Dashboard build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint (errors fail, warnings are reported)
        run: npm run lint
      - run: npm run build
      - name: Committed ui/dist matches the source
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::ui/dist is out of date. Run 'cd ui && npm run build' (Node 22) and commit ui/dist:"
            git status --porcelain -- dist; exit 1
          fi

  docker:
    name: Offline Docker image
    needs: [tests, ui]
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/penultimate' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and run with --network none
        run: make docker-offline-test
      - name: Container log
        if: always()
        run: docker logs beans-offline 2>&1 | tail -80 || true
